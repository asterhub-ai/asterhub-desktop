# Replay pins the passthrough sandbox: the recorded corpus is machine-independent,
# and a host-local backend would register platform-specific repair skills.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- id: llm-deepseek
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 8192
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: high

- insert:
    - id: skill-office
      name: '@deepseek-ai/dsh-skill-office'
      disabled: false
      config:
        assetRoot: !!js process.cwd() + '/office-skills'
        node: !!js process.cwd() + '/office-node'
        cli: !!js process.cwd() + '/render-cli.cjs'

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true
