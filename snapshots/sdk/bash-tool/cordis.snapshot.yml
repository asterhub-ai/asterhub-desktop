# Keyless replay layer for the ordinary SDK snapshot composition.

# The deployment persona suffix references the unregistered {{cwd}} variable.
- id: system-prompt
  config:
    personaSuffix: ''

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash

- id: session-log-deepseek
  config:
    enabled: false
