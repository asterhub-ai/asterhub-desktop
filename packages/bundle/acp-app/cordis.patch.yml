# The automation-only ACP application over dsh-base. Stdout belongs to ACP.

- id: session-title-llm
  disabled: true

- insert:
    - id: acp-app-startup
      name: '@deepseek-ai/dsh-acp-app'

    - id: acp
      name: '@deepseek-ai/dsh-acp'
      inject: [acpAppStartup]
      config:
        provider: sub2api
        model: __unselected__

- id: hmr
  disabled: true
