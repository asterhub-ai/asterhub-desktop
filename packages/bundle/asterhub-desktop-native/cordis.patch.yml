# Desktop-only native composition: the built-in AsterHub schedule Host
# service, the schedule UI panel, and a Desktop-owned clock row. This bundle
# is appended after the shared Web composition (dsh-base + dsh-web-app) only
# in the Desktop-owned profile, dev, and runtime metadata. It is never added
# to the shared web/headless/SDK templates or to OPTIONAL_BUNDLES.
- insert:
    # Desktop-owned clock context: current time, browser zone, and elapsed
    # time for native chat authoring. Uses the maintained time-context
    # package under a Desktop-only row id so the native bundle owns the
    # single clock registration.
    - id: asterhub-time-context
      name: '@deepseek-ai/dsh-time-context'

    # Upstream Schedule Host service: durable task management,
    # timer-driven runtime, and the typed `schedule` Remote namespace.
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    # Schedule task management panel: TaskManagerPage, sidebar entry,
    # and schedule catalog controls.
    - id: ui-schedule
      name: '@deepseek-ai/dsh-client-ui-schedule'

    # Desktop-only browser-use capability: exclusive browser-use registry slot.
    - id: browser-use
      name: '@deepseek-ai/dsh-browser-use'

    # Desktop-only built-in Sidebar Browser provider: operations, tools, and skills.
    - id: browser-use-desktop
      name: '@deepseek-ai/dsh-browser-use-desktop'
      config:
        operationTimeoutMs: 3000
        navigationTimeoutMs: 30000
        snapshotMaxChars: 50000
        readResultMaxChars: 50000

    # Desktop computer-use capability: exclusive computer-use registry slot.
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'

    # Native Cua Driver computer-use provider.
    - id: computer-use-cua-driver-native
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-native'
